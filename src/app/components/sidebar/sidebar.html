<aside class="flex-shrink-0 flex flex-col bg-slate-100 dark:bg-background-dark h-full w-full">
  <div class="p-6 flex flex-col h-full">
    <!-- Logo -->
    <div class="flex items-center gap-3 mb-8">
      <div class="bg-primary p-2 rounded-lg">
        <span class="material-symbols-outlined text-white text-xl">sticky_note_2</span>
      </div>
      <h1 class="text-xl font-bold tracking-tight">Helper Note</h1>
    </div>

    <!-- Folders -->
    <div class="flex flex-col gap-6 flex-1 overflow-y-auto custom-scrollbar">
      <div class="flex flex-col gap-1">
        <p class="text-xs font-semibold text-slate-500 dark:text-slate-400 uppercase tracking-wider mb-2 px-3">Folders</p>
        <nav class="flex flex-col gap-1">
          <!-- All notes -->
          <a
            (click)="selectFolder(null)"
            [class]="noteService.selectedFolderId() === null
              ? 'flex items-center gap-3 px-3 py-2 rounded-lg bg-primary/10 text-primary cursor-pointer'
              : 'flex items-center gap-3 px-3 py-2 rounded-lg text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors cursor-pointer'"
          >
            <span class="material-symbols-outlined text-lg">notes</span>
            <span class="text-sm font-medium">Todas las notas</span>
          </a>

          <!-- Dynamic folders -->
          @for (folder of noteService.folders(); track folder.id) {
            @if (editingFolderId() === folder.id) {
              <div class="flex items-center gap-2 px-3 py-2">
                <input
                  class="flex-1 text-sm bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded px-2 py-1 focus:outline-none focus:ring-1 focus:ring-primary"
                  [value]="editingFolderName()"
                  (input)="editingFolderName.set($any($event.target).value)"
                  (keydown.enter)="confirmEdit(folder.id)"
                  (keydown.escape)="cancelEdit()"
                  autofocus
                />
                <button (click)="confirmEdit(folder.id)" class="text-green-500 hover:text-green-400">
                  <span class="material-symbols-outlined text-lg">check</span>
                </button>
                <button (click)="cancelEdit()" class="text-slate-400 hover:text-slate-300">
                  <span class="material-symbols-outlined text-lg">close</span>
                </button>
              </div>
            } @else {
              <a
                (click)="selectFolder(folder.id)"
                (dblclick)="startEditing(folder.id, folder.name)"
                [class]="noteService.selectedFolderId() === folder.id
                  ? 'flex items-center gap-3 px-3 py-2 rounded-lg bg-primary/10 text-primary cursor-pointer group'
                  : 'flex items-center gap-3 px-3 py-2 rounded-lg text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors cursor-pointer group'"
              >
                <span class="material-symbols-outlined text-lg">folder</span>
                <span class="text-sm font-medium flex-1 truncate">{{ folder.name }}</span>
                <button
                  (click)="deleteFolder(folder.id, $event)"
                  class="material-symbols-outlined text-sm opacity-0 group-hover:opacity-100 text-slate-400 hover:text-red-400 transition-all"
                >delete</button>
              </a>
            }
          }
        </nav>
      </div>
    </div>

    <!-- Bottom -->
    <div class="mt-auto pt-6 border-t border-slate-200 dark:border-slate-800">
      @if (showNewFolderInput()) {
        <div class="flex items-center gap-2 mb-4">
          <input
            class="flex-1 text-sm bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-600 rounded-lg px-3 py-2 focus:outline-none focus:ring-1 focus:ring-primary"
            placeholder="Nombre de la carpeta..."
            [value]="newFolderName()"
            (input)="newFolderName.set($any($event.target).value)"
            (keydown.enter)="confirmNewFolder()"
            (keydown.escape)="cancelNewFolder()"
            autofocus
          />
          <button (click)="confirmNewFolder()" class="text-green-500 hover:text-green-400">
            <span class="material-symbols-outlined text-lg">check</span>
          </button>
          <button (click)="cancelNewFolder()" class="text-slate-400 hover:text-slate-300">
            <span class="material-symbols-outlined text-lg">close</span>
          </button>
        </div>
      } @else {
        <button
          (click)="showNewFolder()"
          class="w-full flex items-center justify-center gap-2 bg-primary hover:bg-primary/90 text-white rounded-lg py-2.5 transition-all shadow-lg shadow-primary/20 mb-4"
        >
          <span class="material-symbols-outlined text-xl">add</span>
          <span class="text-sm font-bold">Nueva Carpeta</span>
        </button>
      }
      <div
        (click)="navService.goToSettings()"
        [class]="navService.currentView() === 'settings'
          ? 'flex items-center gap-3 px-3 py-2 rounded-lg bg-primary/10 text-primary cursor-pointer'
          : 'flex items-center gap-3 px-3 py-2 rounded-lg text-slate-600 dark:text-slate-400 hover:bg-slate-200 dark:hover:bg-slate-800 cursor-pointer transition-colors'"
      >
        <span class="material-symbols-outlined text-lg">settings</span>
        <span class="text-sm font-medium">Configuración</span>
      </div>
    </div>
  </div>
</aside>
