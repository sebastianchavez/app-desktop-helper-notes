<div class="flex h-screen w-full bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100">
  <!-- Sidebar -->
  <div class="flex-shrink-0 h-full" [style.width.px]="sidebarWidth()">
    <app-sidebar />
  </div>
  <app-resize-handle (resizing)="onSidebarResize($event)" />

  @if (navService.currentView() === 'settings') {
    <app-settings />
  } @else {
    <!-- Note List -->
    <div class="flex-shrink-0 h-full" [style.width.px]="noteListWidth()">
      <app-note-list />
    </div>
    <app-resize-handle (resizing)="onNoteListResize($event)" />

    <!-- Editor -->
    <app-note-editor />
  }
</div>
